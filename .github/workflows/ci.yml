name: CI

# NOTE ON LAYOUT: the mobile app IS this repo's root — there is no `mobile-app/`
# subfolder — so there is no `defaults.working-directory` block and
# cache-dependency-path is unprefixed. If the app is ever moved into a subfolder,
# both need to come back.

on:
  pull_request:
    branches: [main, dev_T4]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Its own job so a broken contract freeze shows up as a separate, clearly named
  # ✗ ("typecheck") rather than being buried in a combined step.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Typechecks every contract AND src/shared/contracts/__typecheck__.ts, the
      # canary that goes red when a frozen shape changes.
      - run: npm run typecheck

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # ESLint is a real dependency now, so this runs unguarded: a missing
      # binary, a missing config, or any lint failure fails the job. It must
      # never report a green it hasn't earned. --max-warnings=0 (in the npm
      # script) means warnings fail too, not just errors.
      - name: Lint
        run: npm run lint

      # Unguarded since P0-1: jest + jest-expo are real dependencies, so a
      # missing binary is a genuine failure, not a skip. `test:ci` carries both a
      # coverage gate (see `jest.coverageThreshold` in package.json — thresholds are
      # today's measured floor, not aspirational, so a real regression fails the job
      # rather than silently landing) AND --passWithNoTests (most feature folders are
      # not empty any more, but this stays until every CAP is certain to have a spec).
      - name: Test
        run: npm run test:ci

      # assets/reader/reader-epub.html and reader-pdf.html are GENERATED (from
      # webview/reader-*.template.html plus the shared webview/reader.bridge.html)
      # AND TRACKED, so editing a template or the fragment without rerunning the
      # generator ships HTML that no longer matches its source — and nothing else
      # catches it. The bridge drift guard in readerBridge.test.ts reads the
      # TEMPLATES, not these artifacts, so the whole suite goes green on a stale
      # file. This step is the only thing standing between a forgotten rebuild and
      # shipping stale HTML.
      #
      # BOTH artifacts, named explicitly rather than `-- assets/reader/`: that
      # directory also holds sample-plaintext.epub, which is deliberately NOT covered
      # (see below).
      #
      # Editing the shared fragment makes this matter more than it used to, not less:
      # one edit invalidates BOTH artifacts, so it is now possible to rebuild and
      # commit only the one you were looking at.
      #
      # Regenerate-and-diff rather than a jest test: the check is "is the tracked
      # artifact what the generator produces", and only git can answer that.
      - name: Reader HTML is freshly generated
        run: |
          npm run reader:build-html
          git diff --exit-code -- assets/reader/reader-epub.html assets/reader/reader-pdf.html

      # The sample PDF is generated and tracked too, and UNLIKE the sample EPUB it is
      # byte-reproducible, so it can be checked the same way. generateSamplePdf.ts
      # emits no /CreationDate, /ModDate or /ID; that is asserted by the script itself,
      # so this step and that assertion fail together rather than drifting apart.
      #
      # `reader:build-sample` (the EPUB) is still deliberately EXCLUDED:
      # generateSampleEpub.ts builds a zip whose entries carry generation timestamps,
      # so it is not byte-reproducible and the same check would fail on every run.
      - name: Sample PDF is freshly generated
        run: |
          npm run reader:build-sample-pdf
          git diff --exit-code -- assets/reader/sample-plaintext.pdf
