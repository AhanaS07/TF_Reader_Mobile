name: CI

# NOTE ON LAYOUT: the mobile app IS this repo's root — there is no `mobile-app/`
# subfolder — so there is no `defaults.working-directory` block and
# cache-dependency-path is unprefixed. If the app is ever moved into a subfolder,
# both need to come back.

on:
  pull_request:
    branches: [main, dev_T4]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Its own job so a broken contract freeze shows up as a separate, clearly named
  # ✗ ("typecheck") rather than being buried in a combined step.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Typechecks every contract AND src/shared/contracts/__typecheck__.ts, the
      # canary that goes red when a frozen shape changes.
      - run: npm run typecheck

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # ESLint is a real dependency now, so this runs unguarded: a missing
      # binary, a missing config, or any lint failure fails the job. It must
      # never report a green it hasn't earned. --max-warnings=0 (in the npm
      # script) means warnings fail too, not just errors.
      - name: Lint
        run: npm run lint

      # Unguarded since P0-1: jest + jest-expo are real dependencies, so a
      # missing binary is a genuine failure, not a skip. Still --passWithNoTests
      # (see the npm script) because most feature folders are empty; drop that
      # flag once every CAP has at least one spec.
      - name: Test
        run: npm run test:ci

      # assets/reader/reader.html is GENERATED (from webview/reader.template.html)
      # AND TRACKED, so editing the template without rerunning the generator ships
      # HTML that no longer matches its source — and nothing else catches it. The
      # bridge drift guard in readerBridge.test.ts reads the TEMPLATE, not this
      # artifact, so the whole suite goes green on a stale file. This step is the
      # only thing standing between a forgotten rebuild and shipping stale HTML.
      #
      # Regenerate-and-diff rather than a jest test: the check is "is the tracked
      # artifact what the generator produces", and only git can answer that.
      #
      # reader.html ONLY, not the sibling `reader:build-sample` artifact —
      # generateSampleEpub.ts builds a zip whose entries carry generation
      # timestamps, so it is not byte-reproducible and would fail this every run.
      - name: Reader HTML is freshly generated
        run: |
          npm run reader:build-html
          git diff --exit-code -- assets/reader/reader.html
