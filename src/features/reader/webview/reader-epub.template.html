<!doctype html>
<!--
  src/features/reader/webview/reader-epub.template.html

  SOURCE TEMPLATE — not the file the app loads. `npm run reader:build-html`
  (src/features/reader/scripts/buildReaderHtml.ts) inlines JSZip, epub.js and the
  shared bridge fragment into the @inject markers below and writes the result to
  assets/reader/reader-epub.html, which is what the WebView actually loads.
  Edit THIS file, then re-run the build. Never hand-edit the generated one.

  THIS IS THE EPUB TEMPLATE. Its sibling is reader-pdf.template.html, and the two
  are separate files rather than one branching file so that an EPUB read does not
  carry ~1.4MB of inlined pdf.js it can never call. What they SHARE — post(),
  fail(), showFallback(), the catch-alls and base64ToArrayBuffer() — lives in
  reader.bridge.html and is injected into both, so there is one copy of the bridge
  rather than two to hand-sync.

  WHY THE LIBS ARE INLINED RATHER THAN <script src="./epub.min.js">:
  Metro treats `.js` as a SOURCE extension, not an asset extension, so a `.js`
  file cannot be bundled and served as a sibling file next to this HTML. On top
  of that, release Android builds rename assets under file:///android_asset/,
  so relative sub-resource paths are not stable. One self-contained file with
  zero sub-resource requests dodges both problems and guarantees the offline-
  first requirement by construction: this page cannot make a network request
  because there is nothing in it to fetch.

  THERE IS NO SCRIPT IN THIS FILE ANY MORE, AND THAT IS THE POINT.
  The behaviour lives in webview/src/epub.entry.ts — real, typechecked TypeScript that
  IMPORTS ReaderMessage and ReaderCommand from readerBridge.ts. esbuild compiles it into
  the @inject:entry marker below. So this file is HTML and CSS only, and the bridge's two
  halves are one contract instead of two hand-synced descriptions of one.

  WHAT STILL BELONGS HERE: the DOM the entry queries (#viewer, #fallback) and the CSS,
  which a .ts file cannot carry. readerTemplate.test.ts asserts those selectors exist,
  because the entry silently does nothing useful without them.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TF Reader</title>
    <style>
      /*
        THE BLANK-PAGE TRAP: epub.js renders into a container it measures. If
        #viewer resolves to zero height it renders nothing at all and reports no
        error — the single most common "epub.js is broken" false alarm. The
        html/body/#viewer height chain below is load-bearing; do not replace it
        with `height: auto` or remove the html/body rule.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        -webkit-text-size-adjust: 100%;
      }

      /*
        HORIZONTAL safe-area insets only, and the asymmetry is deliberate.
        `viewport-fit=cover` in the meta above is what makes env() resolve to a
        real number rather than 0 — without it these are no-ops.

        Why not top/bottom: env() reports the WINDOW's inset, not this element's
        offset within it, and App.tsx already wraps the reader in a SafeAreaView
        with edges={['top','bottom']}. Adding them here would inset twice and
        lose a line of text to nothing. Left/right are exactly the edges RN is
        not covering, and they are 0 in portrait — so this is a landscape and
        notch fix that changes nothing on a portrait phone.

        Whoever removes App.tsx's temporary SafeAreaView (it goes with
        RootNavigator) owns the vertical half of this.

        box-sizing keeps the html/body/#viewer height chain exact: without it,
        padding would push #viewer past 100% and reintroduce overflow on a page
        that must not have any.
      */
      #viewer {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /*
        Last-resort visible failure state. RN owns the real error banner (driven
        by the postMessage 'error' events below), but if the bridge itself is
        what broke, RN never hears about it — so the WebView must be able to say
        so on its own rather than sitting there white. "Not a blank page" is an
        explicit acceptance criterion for this task.
      */
      #fallback {
        display: none;
        box-sizing: border-box;
        padding: 24px;
        font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #8a1c1c;
        background: #fdf2f2;
      }
      #fallback.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <pre id="fallback"></pre>

    <!-- @inject:jszip -->
    <!--
      LOAD ORDER IS LOAD-BEARING: JSZip must be defined before epub.js runs.
      epub.js 0.3.93 ships JSZip as a webpack EXTERNAL, not a bundle — verified
      against node_modules/epubjs/dist/epub.min.js, whose UMD header ends
      `t.ePub=e(t.JSZip)`. It reads window.JSZip at definition time, so with the
      order swapped `ePub` is defined with JSZip === undefined and every archived
      (i.e. every real) EPUB fails deep inside the unzip with a confusing error.
    -->
    <!-- @inject:epubjs -->

    <!-- @inject:entry -->
  </body>
</html>
