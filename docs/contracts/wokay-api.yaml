        '401': { $ref: '#/components/responses/Unauthorized' }
# ══════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    appToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Issued by flambeau. Carries `aud` of `tf-app`.
        Accepted on `/opds/v1/**` and `/api/v1/**`.
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Issued by us at `/api/admin/v1/auth/login`. Carries `aud` of `tf-admin`.
        Accepted on `/api/admin/v1/**` only.
        Bound to a live `adminSessions` row and rejected once that row is revoked or
        expired.

  parameters:
    Page:
      name: page
      in: query
      description: Zero based page number
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Items per page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    InstitutionId:
      name: institutionId
      in: path
      required: true
      schema: { type: string }
      example: inst_7f3
    PublisherId:
      name: publisherId
      in: path
      required: true
      schema: { type: string }
      example: pub_rtlg
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
      example: item_42
    ContentTypeFilter:
      name: contentType
      in: query
      description: Fixed enum, so the client can hardcode the filter chips
      schema: { $ref: '#/components/schemas/ContentType' }
    AccessTierFilter:
      name: accessTier
      in: query
      schema: { $ref: '#/components/schemas/AccessTier' }

  responses:
    BadRequest:
      description: The request was malformed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-08-10T14:00:00Z'
            status: 400
            code: VALIDATION_FAILED
            message: size must be between 1 and 100
            path: /api/v1/institutions
            traceId: b7c1f2a9
    Unauthorized:
      description: No token, an invalid token, or the wrong audience
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-08-10T14:00:00Z'
            status: 401
            code: UNAUTHENTICATED
            message: A valid app token is required
            path: /opds/v1/institutions/inst_7f3/catalogue
            traceId: b7c1f2a9
    Forbidden:
      description: Authenticated, but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-08-10T14:00:00Z'
            status: 403
            code: FORBIDDEN_SCOPE
            message: This operator may only modify publisher pub_rtlg
            path: /api/admin/v1/catalogue-items/item_99
            traceId: b7c1f2a9
    InstitutionMismatch:
      description: The institution in the path does not match the one in the token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-08-10T14:00:00Z'
            status: 403
            code: FORBIDDEN_INSTITUTION_MISMATCH
            message: This token belongs to a different institution
            path: /opds/v1/institutions/inst_2b9/catalogue
            traceId: b7c1f2a9
    NotFound:
      description: |
        Unknown, archived, or not entitled. The three are deliberately indistinguishable,
        so the catalogue cannot be mapped by walking identifiers.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-08-10T14:00:00Z'
            status: 404
            code: NOT_FOUND
            message: No such item
            path: /opds/v1/institutions/inst_7f3/publications/item_999
            traceId: b7c1f2a9
    ContentAccessErrors:
      description: |
        **Referenced by no path in this file, deliberately.** These are the three failures
        our `ContentAccessGrant` code raises, and they reach the reader through
        **flambeau's** content endpoint, because we serve no content over HTTP.

        They are documented here so flambeau returns our envelope and our vocabulary
        rather than inventing a second error shape.

        | Code | Status | Cause |
        |---|---|---|
        | `NO_ENTITLEMENT` | 403 | the institution may not read this book |
        | `DOWNLOAD_NOT_PERMITTED` | 403 | `intent: DOWNLOAD` on an `ELITE` title, which is online only |
        | `CONTENT_NOT_READY` | 409 | ingest has not finished, or it failed |
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notEntitled:
              summary: 403, the institution has no grant covering this book
              value:
                timestamp: '2026-08-10T14:00:00Z'
                status: 403
                code: NO_ENTITLEMENT
                message: This title requires a subscription. Sign in through your institution
                path: '{flambeauBaseUrl}/api/v1/content/item_42/access'
                traceId: b7c1f2a9
            downloadRefused:
              summary: 403, elite titles are online only whatever the UI offered
              value:
                timestamp: '2026-08-10T14:00:00Z'
                status: 403
                code: DOWNLOAD_NOT_PERMITTED
                message: This title can be read online only
                path: '{flambeauBaseUrl}/api/v1/content/item_42/access'
                traceId: b7c1f2a9
            notReady:
              summary: 409, the file is still being processed
              value:
                timestamp: '2026-08-10T14:00:00Z'
                status: 409
                code: CONTENT_NOT_READY
                message: This book is still being processed
                path: '{flambeauBaseUrl}/api/v1/content/item_42/access'
                traceId: b7c1f2a9
    StaleVersion:
      description: >-
        Somebody else saved this record after you loaded it. Reload, reapply your change
        and save again. Returned instead of silently overwriting their work.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-08-10T14:00:00Z'
            status: 409
            code: STALE_VERSION
            message: This record was changed by somebody else. Reload and try again
            path: /api/admin/v1/institutions/inst_7f3/feed-settings
            traceId: b7c1f2a9
    CodeTaken:
      description: >-
        A record with that unique value already exists. The value is a `code` for
        publishers, collections and institutions, and the `email` for an admin user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            timestamp: '2026-08-10T14:00:00Z'
            status: 409
            code: CODE_TAKEN
            message: That value is already in use
            path: /api/admin/v1/publishers
            traceId: b7c1f2a9

  schemas:

    # ── shared ───────────────────────────────────────────────────
    Error:
      type: object
      description: Every error in the system uses this shape.
      required: [timestamp, status, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: For a human. Do not switch on this, switch on `code`.
        path: { type: string }
        traceId:
          type: string
          description: Quote this when reporting a problem.

    ErrorCode:
      type: string
      description: |
        Machine readable. **Every value here is reachable.** There are no spare codes to
        write dead handlers for.

        Three of them, `NO_ENTITLEMENT`, `CONTENT_NOT_READY` and `DOWNLOAD_NOT_PERMITTED`,
        are produced by our code but surface through **flambeau's** content endpoint rather
        than through a path in this file, because we serve no content over HTTP. They use
        this same envelope and this same vocabulary.

        Note what is deliberately absent. There is no `TOKEN_EXPIRED`: an expired token
        and a forged one both answer `UNAUTHENTICATED`, because telling a caller which
        one they have is telling an attacker whether they guessed a real token. There is
        no `INSTITUTION_INACTIVE` either, because an inactive institution answers
        `NOT_FOUND` so its existence is not disclosed.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN_SCOPE
        - FORBIDDEN_INSTITUTION_MISMATCH
        - NO_ENTITLEMENT
        - CONTENT_NOT_READY
        - DOWNLOAD_NOT_PERMITTED
        - NOT_FOUND
        - CODE_TAKEN
        - TOO_MANY_IDS
        - VALIDATION_FAILED
        - STALE_VERSION

    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    RecordStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, RETIRED]

    SortOrder:
      type: string
      description: >-
        The only sort vocabulary in the system. `feedSettings.defaultSort` and the
        `sort` query parameter both use it, so a stored default can never name an
        ordering the endpoint cannot perform.
      enum: [publishedAt.desc, publishedAt.asc, title.asc, title.desc]

    Isbn:
      type: string
      pattern: '^(97[89])?[0-9]{9}[0-9X]$'
      description: >-
        Digits only, no hyphens. ISBN-10 or ISBN-13. Hyphens and whitespace are
        stripped on save, so `978-0-367-21174-5` is stored and returned as
        `9780367211745`. Optional, because audiobooks frequently have none.
        Indexed but not unique.
      example: '9780367211745'

    ContentType:
      type: string
      description: >-
        What the **book** is, set by an operator at create time. Drives `@type` in OPDS
        metadata and decides which validation rules apply, for example that audio needs a
        duration.
      enum: [PDF, EPUB, AUDIO]

    AssetFormat:
      type: string
      description: >-
        What an uploaded **file** is. Same three values as `ContentType` today, and a
        separate name because they answer different questions: one book can carry more
        than one asset, so a `contentType` of `PDF` may sit beside an `EPUB` asset.
      enum: [PDF, EPUB, AUDIO]

    AccessTier:
      type: string
      description: |
        **The one tier vocabulary in the system.** An operator sets it on the book; the
        feed reports it back as `licenceModel`; the `?accessTier=` filter takes it. Same
        three values in all three places, so a client never translates.

        | Value | Badge | Primary button | Download | Copy limit |
        |---|---|---|---|---|
        | `OPEN_ACCESS` | Free to read | Read | shown | no |
        | `SUBSCRIPTION` | Included | Read | shown | no |
        | `ELITE` | Limited copies | Borrow | **hidden** | yes |

        A book is encrypted unless it is `OPEN_ACCESS`, or unless it is audio.
      enum: [OPEN_ACCESS, SUBSCRIPTION, ELITE]

    ItemStatus:
      type: string
      description: >-
        The editorial lifecycle of a book, set by an operator. Only `PUBLISHED` books
        appear in a feed, and only then if `contentState` is also `READY`.
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    EntitlementScope:
      type: string
      description: What a grant points at. `scopeId` is read against this.
      enum: [PUBLISHER, COLLECTION, ITEM]

    EntitlementStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, REVOKED]

    Intent:
      type: string
      description: >-
        How the reader means to use the file. Controls the signed URL lifetime.
        `DOWNLOAD` is refused for `ELITE`, which is online only.
      enum: [STREAM, DOWNLOAD]

    InstitutionType:
      type: string
      enum: [UNIVERSITY, COLLEGE, LIBRARY, CORPORATE]

    AdminRole:
      type: string
      enum: [SUPER_ADMIN, PUBLISHER_ADMIN, INSTITUTION_ADMIN]

    ContentState:
      type: string
      description: >-
        Where a file is in the ingest pipeline. A book that is not `READY` never appears
        in any feed. Named `PROCESSING` rather than `ENCRYPTING` because open access
        titles and all audio pass through it without ever being encrypted.
      enum: [NONE, QUEUED, PROCESSING, READY, FAILED]

    StatusChange:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/RecordStatus' }
        reason: { type: string, maxLength: 500 }

    # ── public institutions ──────────────────────────────────────
    InstitutionSummary:
      type: object
      description: >-
        Public fields only. `type` is on `AdminInstitution`, not here.
      required: [id, code, name, country]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        country: { type: string }
        city: { type: string }
        branding: { $ref: '#/components/schemas/Branding' }

    InstitutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/InstitutionSummary' }

    Branding:
      type: object
      properties:
        logoUrl: { type: string, format: uri }
        primaryColor: { type: string, example: '#003E74' }

    SignIn:
      type: object
      description: Read shape. `method` is always present so the client needs no special case.
      required: [method]
      properties:
        method:
          type: string
          enum: [SAML]
          description: Always SAML. Institutional sign in has no other mode.
        idpHint:
          type: string
          maxLength: 60
          description: Which mock identity provider flambeau should use for this institution.

    SignInWrite:
      type: object
      description: >-
        Write shape. **`method` is not here**, because it is always `SAML` and there is no
        field on the record to configure. Only `idpHint` is settable.

        Nested rather than flat so the console reads and writes the same path,
        `signIn.idpHint`. A flat `idpHint` on write and a nested one on read is the kind of
        mismatch that makes an operator think their save failed.
      properties:
        idpHint: { type: string, maxLength: 60 }

    InstitutionDetail:
      allOf:
        - $ref: '#/components/schemas/InstitutionSummary'
        - type: object
          properties:
            signIn: { $ref: '#/components/schemas/SignIn' }
            catalogueUrl:
              type: string
              format: uri
              description: Follow this rather than building it. Our URL scheme may change.

    # ── OPDS ─────────────────────────────────────────────────────
    OpdsLink:
      type: object
      description: A plain feed-level link. Carries no acquisition properties.
      required: [href]
      properties:
        rel:
          type: string
          description: 'Feed level: `self`, `next`, `previous`, `last`, `search`.'
        href: { type: string }
        type: { type: string }
        title: { type: string }
        templated:
          type: boolean
          description: When true the href is an RFC 6570 template, for example `.../search{?query}`.

    OpdsNavigationLink:
      description: >-
        An entry in a `navigation` array. Always titled, `rel` is `subsection`, and it
        never carries acquisition properties or image dimensions. It is a signpost.
      allOf:
        - $ref: '#/components/schemas/OpdsLink'
        - type: object
          required: [title]
          properties:
            rel: { type: string, example: subsection }

    OpdsPublicationLink:
      description: >-
        A link inside a publication. Either the `self` link, or **the one acquisition
        link**, which is the only link in the whole feed that carries `properties`.
      allOf:
        - $ref: '#/components/schemas/OpdsLink'
        - type: object
          properties:
            rel:
              type: string
              description: >-
                `self`, or exactly one acquisition rel. Which one depends on the tier and
                on whether this caller can obtain the book.
              enum:
                - self
                - 'http://opds-spec.org/acquisition'
                - 'http://opds-spec.org/acquisition/open-access'
                - 'http://opds-spec.org/acquisition/borrow'
                - 'http://opds-spec.org/acquisition/subscribe'
            properties:
              allOf:
                - $ref: '#/components/schemas/OpdsLinkProperties'
              description: Present on the acquisition link only, never on `self`.

    OpdsImageLink:
      description: A cover image. Carries dimensions, never acquisition properties.
      allOf:
        - $ref: '#/components/schemas/OpdsLink'
        - type: object
          properties:
            width: { type: integer }
            height: { type: integer }

    OpdsLinkProperties:
      type: object
      description: >-
        Extra facts about **an acquisition link**. Nothing else in the feed has these.
        Switch on `licenceModel`.
      required: [licenceModel]
      properties:
        licenceModel:
          allOf:
            - $ref: '#/components/schemas/AccessTier'
          description: >-
            **Always present on an acquisition link, including open access.** Do not
            infer the tier from `rel` alone. `rel` says how the book is obtained,
            `licenceModel` says what to render, and the client should read one field
            rather than two. Same three values as `accessTier` on the book and as the
            `?accessTier=` filter.
        indirectAcquisition:
          type: array
          minItems: 1
          maxItems: 1
          description: >-
            **What you eventually get, as opposed to what the href returns.** The
            `open-access` and `borrow` hrefs point at flambeau and answer with JSON, not
            with a book, so the link's own `type` is `application/json` and the real media
            type is here.
            This is the standard OPDS 2.0 field for a link that leads to a file rather
            than being one. Absent on a `subscribe` link, which leads to a page and not to
            a file at all.
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                description: The media type of the book itself.
                example: application/pdf
        availability:
          type: object
          description: >-
            Present only when this caller **cannot** obtain the book, which happens on the
            public discovery routes. When it is present, `rel` is
            `.../acquisition/subscribe` and there is no `indirectAcquisition`, so render
            the metadata and a route to access rather than a Read button.
          required: [state]
          properties:
            state:
              type: string
              enum: [available, unavailable]
              example: unavailable
        copies:
          type: object
          description: |
            **`total` only.** We do not call flambeau while building a feed, so we cannot
            know how many copies are free. Fetch `available` from flambeau on the detail
            screen. Absent unless `licenceModel` is `ELITE`.
          properties:
            total: { type: integer, minimum: 1 }
        encrypted:
          allOf:
            - $ref: '#/components/schemas/EncryptedInfo'
          description: Absent for open access and for all audio.
        hasSearchIndex:
          type: boolean
          description: False for audio, and for any book whose text could not be extracted.
        canPersist:
          type: boolean
          description: |
            Whether an offline copy is allowed. **Use this for the download button, not
            the tier.** False for `ELITE`, and the server refuses a `DOWNLOAD` intent
            regardless of what the UI shows.
        fileSize: { type: integer, minimum: 1 }

    EncryptedInfo:
      type: object
      description: Present only when the file is locked.
      properties:
        algorithm:
          type: string
          enum: ['http://www.w3.org/2009/xmlenc11#aes256-gcm']
          description: >-
            The **W3C XML Encryption 1.1 URI**, which is what the OPDS encryption
            extension uses. This is the same cipher the `ContentGrant.encryption` block
            calls `AES-256-GCM`; that surface is ours rather than OPDS, so it uses the
            short name a reader can switch on. One algorithm, two spellings, one on each
            side of the standard.
          example: 'http://www.w3.org/2009/xmlenc11#aes256-gcm'
        originalLength:
          type: integer
          description: Plaintext length, after unlocking.

    OpdsFeedMetadata:
      type: object
      required: [title]
      properties:
        title: { type: string }
        numberOfItems: { type: integer, minimum: 0 }
        itemsPerPage: { type: integer, minimum: 1 }
        currentPage:
          type: integer
          minimum: 0
          description: >-
            **Zero based**, the same as the `page` query parameter, so page 0 is the first
            page. Worth stating because many OPDS readers assume one based.
        modified:
          type: string
          format: date-time
          description: When this feed last changed. Moves with `catalogueVersion`.

    OpdsGroupMetadata:
      type: object
      description: A group has a title and a count. Paging belongs to the shelf behind it.
      required: [title]
      properties:
        title: { type: string }
        numberOfItems: { type: integer }

    OpdsNavigationFeed:
      type: object
      description: |
        The **root feed** shape. Signposts and shelves, no top-level publications.

        `links` always contains `self`. Arrays are never empty: if there is nothing to
        put in one the key is omitted.
      required: [metadata, links, navigation]
      properties:
        metadata: { $ref: '#/components/schemas/OpdsFeedMetadata' }
        links:
          type: array
          minItems: 1
          contains:
            type: object
            required: [rel]
            properties:
              rel: { const: self }
          items: { $ref: '#/components/schemas/OpdsLink' }
        navigation:
          type: array
          minItems: 1
          description: >-
            **Always present, always at least the *All titles* entry.** Required rather
            than optional, because a root feed with no way to reach the rest of the
            catalogue would be a dead end, and because it is what keeps a brand new
            institution's feed valid when no shelf has been curated yet.
          items: { $ref: '#/components/schemas/OpdsNavigationLink' }
        groups:
          type: array
          minItems: 1
          maxItems: 3
          description: One per curated shelf that survived filtering. Never more than three.
          items: { $ref: '#/components/schemas/OpdsGroup' }

    OpdsPublicationFeed:
      type: object
      description: |
        The **list** shape: one shelf, a search result, or the public feed. A flat page
        of books.

        **There are no `groups` here.** You are already inside one shelf, so there is
        nothing to nest.

        Exactly one of `publications` or `navigation` is present. `navigation` appears
        only in the empty case, carrying a single link back to the catalogue, because
        the OPDS schema forbids an empty `publications` array.
      required: [metadata, links]
      anyOf:
        - required: [publications]
        - required: [navigation]
      properties:
        metadata: { $ref: '#/components/schemas/OpdsFeedMetadata' }
        links:
          type: array
          minItems: 1
          description: '`self`, plus `next` and `previous` while there are more pages.'
          contains:
            type: object
            required: [rel]
            properties:
              rel: { const: self }
          items: { $ref: '#/components/schemas/OpdsLink' }
        publications:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OpdsPublication' }
        navigation:
          type: array
          minItems: 1
          description: Empty result only. A way back to the catalogue.
          items: { $ref: '#/components/schemas/OpdsNavigationLink' }

    OpdsGroup:
      type: object
      description: >-
        One curated shelf inside the root feed: a title, a link to the full shelf, and
        the first few books inline. Groups do not nest.
      required: [metadata, publications]
      properties:
        metadata: { $ref: '#/components/schemas/OpdsGroupMetadata' }
        links:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OpdsLink' }
        publications:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OpdsPublication' }

    OpdsPublicationDocument:
      description: >-
        A **standalone publication**, which is what `application/opds-publication+json`
        means. Not a feed, and no `publications` array: `metadata`, `links` and `images`
        sit at the top level. Feeds embed the same object without the `@context`.
      allOf:
        - type: object
          properties:
            '@context':
              type: string
              example: https://readium.org/webpub-manifest/context.jsonld
        - $ref: '#/components/schemas/OpdsPublication'

    OpdsPublication:
      type: object
      required: [metadata, links]
      properties:
        metadata: { $ref: '#/components/schemas/OpdsPublicationMetadata' }
        links:
          type: array
          minItems: 1
          description: The `self` link, plus the acquisition link when the book is obtainable.
          items: { $ref: '#/components/schemas/OpdsPublicationLink' }
        images:
          type: array
          minItems: 1
          description: >-
            Cover images, largest first. `width` and `height` are emitted **only when we
            know them**. Covers are URLs an operator pastes in, pointing at a public
            bucket we never read, so unless the dimensions are stored on the record they
            are omitted rather than guessed.
          items: { $ref: '#/components/schemas/OpdsImageLink' }

    OpdsContributor:
      type: object
      description: >-
        The OPDS 2.0 shape for a named thing: authors, editors, narrators, the
        publisher and subjects all use it. **Not a bare string.**
      required: [name]
      properties:
        name: { type: string }
        sortAs:
          type: string
          description: Surname first, for alphabetical listing. Omitted when unknown.
          example: Gellers, Joshua C.

    OpdsPublicationMetadata:
      type: object
      required: [title]
      properties:
        '@type':
          type: string
          enum: ['http://schema.org/Book', 'http://schema.org/Audiobook']
          description: >-
            Derived from `contentType`. AUDIO becomes `Audiobook`, PDF and EPUB become
            `Book`.
          example: http://schema.org/Book
        identifier:
          type: string
          description: >-
            The book's ISBN, prefixed. **OPDS 2.0 has no `isbn` key, so do not look
            for one.** Read this and strip `urn:isbn:`. Absent entirely when the
            title has no ISBN, so treat it as optional rather than as an empty
            string. The plain-JSON `items:batch` response returns a bare `isbn`
            field instead, because that shape is ours and is not OPDS.
          example: urn:isbn:9780367211745
        title: { type: string }
        subtitle: { type: string }
        author:
          type: array
          items: { $ref: '#/components/schemas/OpdsContributor' }
        editor:
          type: array
          description: Edited volumes have editors and no authors. Both may be absent.
          items: { $ref: '#/components/schemas/OpdsContributor' }
        narrator:
          type: array
          description: Audiobooks only.
          items: { $ref: '#/components/schemas/OpdsContributor' }
        publisher: { $ref: '#/components/schemas/OpdsContributor' }
        language: { type: string }
        published:
          type: string
          format: date
          description: Publication date, from `publishedAt`.
        modified:
          type: string
          format: date-time
          description: When the record last changed, from `updatedAt`.
        description: { type: string }
        numberOfPages: { type: integer }
        duration:
          type: integer
          description: Seconds. Audio only.
        subject:
          type: array
          maxItems: 20
          description: '**Objects, not strings.** `[{ "name": "Law" }]`, never `["Law"]`.'
          items: { $ref: '#/components/schemas/OpdsContributor' }

    # ── catalogue fetch ──────────────────────────────────────────
    BatchItemsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }

    BatchItem:
      type: object
      required: [id, title, contentType, accessTier]
      properties:
        id: { type: string }
        title: { type: string }
        authors:
          type: array
          items: { type: string }
        coverUrl: { type: [string, 'null'], format: uri }
        isbn:
          description: >-
            Null when the title has none. This response is plain JSON, not OPDS,
            so the field is a bare `isbn` rather than a `urn:isbn:` identifier.
          oneOf:
            - $ref: '#/components/schemas/Isbn'
            - type: 'null'
        contentType: { $ref: '#/components/schemas/ContentType' }
        accessTier: { $ref: '#/components/schemas/AccessTier' }
        totalCopies: { type: [integer, 'null'] }
        hasSearchIndex: { type: boolean }

    BatchItemsResponse:
      type: object
      required: [items, notFound, denied]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchItem' }
        notFound:
          type: array
          description: No such item, or archived.
          items: { type: string }
        denied:
          type: array
          description: The item exists, but this caller is not entitled to it.
          items: { type: string }

    # ── the Java seam ────────────────────────────────────────────
    # The eight schemas below belong to NO PATH in this file, and that is deliberate.
    # They are the data shapes of `content.api.ContentAccessGrant`, a Java interface
    # flambeau calls in the same process. They are documented here so there is one file
    # to read. There is no wokay HTTP endpoint that returns a book, in any tier.

    ContentGrantRequest:
      type: object
      description: |
        What flambeau passes in. Not an HTTP body: this is the argument to
        `ContentAccessGrant.grant(...)`.

        **`loan` and `devicePublicKey` are both null for open access, and both required
        for anything else.** A request for a locked book with no `loan` is refused, so no
        caller can obtain a key by forgetting a field.
      required: [itemId, format, intent, subject]
      properties:
        itemId: { type: string, example: item_42 }
        format: { $ref: '#/components/schemas/AssetFormat' }
        intent:
          allOf:
            - $ref: '#/components/schemas/Intent'
          description: >-
            Controls how long the signed URL lives. `DOWNLOAD` is refused for `ELITE`
            with `DOWNLOAD_NOT_PERMITTED`, whatever the client's UI showed.
        subject:
          allOf:
            - $ref: '#/components/schemas/SubjectRef'
          description: >-
            **Required, even for open access.** `grant()` re-resolves the entitlement
            itself rather than trusting that `EntitlementQuery.check()` was called first,
            and it cannot do that without knowing who is asking. It is also what the
            `CONTENT_ACCESS` audit row records.
        devicePublicKey:
          type: [string, 'null']
          description: >-
            Base64 SPKI DER, 392 characters for RSA-2048. **RSA-2048 is the minimum** and
            a shorter key is rejected. Null for open access, where there is no key to wrap.
        loan:
          description: >-
            flambeau's proof that a loan exists. Null for open access. Constructed by
            flambeau and passed directly, so it carries no signature: in one process there
            is no wire for anyone to forge it on.
          oneOf:
            - $ref: '#/components/schemas/LoanProof'
            - type: 'null'
        wantSearchIndex:
          type: boolean
          default: true
          description: >-
            Set false to skip signing an index URL. Saves a signature when the caller only
            wants to stream. When false, `ContentGrant.index` comes back null.

    SubjectRef:
      type: object
      description: >-
        Who is asking. Passed to both seams. We own neither users nor institutions'
        membership, so this is an identifier pair rather than a user record.
      required: [userId, institutionId]
      properties:
        userId:
          type: string
          example: u_88
          description: flambeau's user id. We store it only in `auditLogs.actorId`.
        institutionId:
          type: [string, 'null']
          example: inst_7f3
          description: >-
            Null for a reader with no institution, which is how an open access grant to an
            anonymous B2C reader is expressed.

    LoanProof:
      type: object
      required: [loanId, dueAt]
      properties:
        loanId: { type: string, example: loan_9f2 }
        dueAt: { type: string, format: date-time }

    SignedUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: >-
            Points at object storage, not at us. The bytes travel storage to device and
            pass through no module. Short lived, see `expiresAt`.
        expiresAt: { type: string, format: date-time }
        cipherLength:
          type: integer
          minimum: 1
          description: >-
            What you will download. For a locked file this is exactly
            `12 + plaintext + 16`, so 28 bytes more than `originalLength`.
        originalLength:
          type: integer
          minimum: 1
          description: What you get after unlocking. Equal to `cipherLength` when plaintext.
        mimeType: { type: string, example: application/pdf }

    IndexUrl:
      type: object
      description: The in-file search index. Queried on the device, with no call to us.
      properties:
        url: { type: string, format: uri }
        encrypted:
          type: boolean
          description: >-
            True whenever the book is encrypted. **The index is a searchable copy of the
            text**, so leaving it in plaintext beside a locked book would undo the lock.
        termCount: { type: integer, minimum: 0 }

    Encryption:
      type: object
      description: |
        Null for open access and for all audio.

        The nonce is **the first twelve bytes of the object**. The content file and the
        index file use the same key but different random nonces.
      required: [algorithm, layout, wrappedBek, wrapAlgorithm, keyFingerprint]
      properties:
        algorithm:
          type: string
          enum: [AES-256-GCM]
          example: AES-256-GCM
          description: >-
            Short name, because this block is ours and not OPDS. The feed spells the
            same cipher as `http://www.w3.org/2009/xmlenc11#aes256-gcm`.
        layout:
          type: string
          enum: ['nonce(12) || ciphertext || tag(16)']
          description: >-
            A single fixed value, as an enum rather than free text, so a reader can assert
            it instead of parsing prose. If it ever changes, clients fail loudly.
        wrappedBek:
          type: string
          description: >-
            Base64, **344 characters** for RSA-2048. The book key wrapped to the device
            public key that was supplied, so only that device can unwrap it.

            Not to be confused with `masterWrappedBek`, which is the same key wrapped with
            our master key and **never leaves the server**. Two different values, two
            different names, on purpose.
        wrapAlgorithm:
          type: string
          enum: [RSA-OAEP-256]
          description: >-
            RSA-OAEP with SHA-256 **and MGF1 also SHA-256**. Java defaults MGF1 to SHA-1
            unless an `OAEPParameterSpec` says otherwise, which makes every unwrap fail
            with an unhelpful error. Both sides must set it explicitly.
        keyId:
          type: string
          example: master-v1
          description: Which master key wrapped it. Exists so a second one can be added later.
        keyFingerprint:
          type: string
          description: |
            SHA-256 of the device public key this key was wrapped for. **Required**, and
            the reader must compare it against its own key and refuse if it differs. That
            comparison is what proves nobody in the chain substituted a key, so it cannot
            be optional.
          example: sha256:d5e91261

    ContentGrant:
      type: object
      description: >-
        What `ContentAccessGrant.grant(...)` returns to flambeau. **Not an HTTP response
        body anywhere in this file.** For open access `encryption` is null and the file is
        plaintext. For subscription and elite it is filled in, as in the example below.
      required: [content]
      properties:
        content: { $ref: '#/components/schemas/SignedUrl' }
        index:
          description: Null when the book has no search index, or the caller did not ask for one.
          oneOf:
            - $ref: '#/components/schemas/IndexUrl'
            - type: 'null'
        encryption:
          description: Null for open access and for all audio. The file is then plaintext.
          oneOf:
            - $ref: '#/components/schemas/Encryption'
            - type: 'null'
      example:
        content:
          url: https://storage.tf/tf-content/item_42.enc?X-Amz-Signature=abc123
          expiresAt: '2026-08-10T10:20:00Z'
          cipherLength: 6373780
          originalLength: 6373752
          mimeType: application/pdf
        index:
          url: https://storage.tf/tf-content/item_42.index.enc?X-Amz-Signature=de44
          encrypted: true
          termCount: 18442
        encryption:
          algorithm: AES-256-GCM
          layout: nonce(12) || ciphertext || tag(16)
          wrappedBek: >-
            0j+rOY95jvbSUz3p+prD2JofAxTBnwM3l3gtgvMvT5MHgjK3X4pCc1jb6X17FkNe
            aXSCfR0d6NE4n+Mpjg7SFtI/qzmPeY720lM96fqaw9iaHwMUwZ8DN5d4LYLzL0+T
            B4Iyt1+KQnNY2+l9exZDXml0gn0dHejROJ/jKY4O0hbSP6s5j3mO9tJTPen6msPY
            mh8DFMGfAzeXeC2C8y9PkweCMrdfikJzWNvpfXsWQ15pdIJ9HR3o0Tif4ymODtIW
            0j+rOY95jvbSUz3p+prD2JofAxTBnwM3l3gtgvMvT5MHgjK3X4pCc1jb6X17FkNe
            aXSCfR0d6NE4n+Mpjg7SFg==
          wrapAlgorithm: RSA-OAEP-256
          keyId: master-v1
          keyFingerprint: sha256:d5e91261

    # ── admin ────────────────────────────────────────────────────
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    TokenPair:
      type: object
      description: >-
        Two tokens with different jobs. The access token is a signed JWT that every
        request carries and whose session is re-checked on each admin request, so logout
        takes effect immediately. The refresh token is an opaque random string that exists
        **only** in the `adminSessions` collection, stored hashed, and is sent to
        `/auth/refresh` and `/auth/logout` and nowhere else.
      required: [accessToken, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken:
          type: string
          description: >-
            JWT, `aud` of `tf-admin`. Send it as the `Authorization` bearer header.
        expiresIn:
          type: integer
          description: >-
            Seconds. Short on purpose, as defence in depth; logout also revokes it
            immediately.
          example: 900
        refreshToken:
          type: string
          description: >-
            Opaque, not a JWT. Nothing is encoded in it, so there is nothing to read out
            of it. Never send it in an `Authorization` header.
          example: 8Kd2mXqR7vT1nP4wZ0aB3cE6gH9jL5sY
        refreshExpiresIn:
          type: integer
          description: Seconds. Twelve hours, so one working day needs one sign in.
          example: 43200

    AdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/AdminUser' }

    RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          description: >-
            No `user`. Refreshing proves nothing new about who you are, and the console
            already has it. Call `/auth/me` if it needs re-reading.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AdminSession:
      type: object
      description: |
        **The ninth collection, `adminSessions`.** Returned by no endpoint. It is here
        because refresh tokens need somewhere to live, and eight collections were
        documented before refresh existed.

        One row per sign in. `POST /auth/login` inserts, `POST /auth/refresh` revokes the
        old row and inserts a new one, `POST /auth/logout` sets `revokedAt`.

        **Two indexes are not optional.** A unique index on `refreshTokenHash`, because
        every refresh is a lookup by it. And a **TTL index on `expiresAt`**, because
        without it this is the one collection that grows forever: logout only marks a row
        revoked, it never removes it.
      required: [id, adminUserId, refreshTokenHash, issuedAt, expiresAt]
      properties:
        id: { type: string, example: sess_4b1 }
        adminUserId: { type: string, example: adm_2 }
        refreshTokenHash:
          type: string
          description: >-
            SHA-256 of the token, hex. **The raw token is never stored.** A stolen
            database therefore yields no usable session, the same reason passwords are
            hashed. Unique index.
        issuedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Twelve hours after `issuedAt`. TTL index, so expired rows delete themselves.
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Set by `/auth/refresh` when the token is rotated, and by `/auth/logout`. Null
            while the session is live. A row with this set can never be exchanged again
            and any access token carrying this session id is rejected from that moment.

    AdminUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/AdminRole' }
        scopePublisherId: { type: [string, 'null'] }
        scopeInstitutionId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RecordStatus' }

    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminUser' }

    AdminUserCreate:
      type: object
      required: [email, name, role, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        password:
          type: string
          format: password
          minLength: 12
          description: Hashed before storage. Never returned by any endpoint.
        role: { $ref: '#/components/schemas/AdminRole' }
        scopePublisherId:
          type: [string, 'null']
          description: Required when `role` is PUBLISHER_ADMIN, otherwise null.
        scopeInstitutionId:
          type: [string, 'null']
          description: Required when `role` is INSTITUTION_ADMIN, otherwise null.

    AdminUserUpdate:
      type: object
      description: >-
        `email` is not here. It is the operator's identity; to change it, deactivate and
        create.
      required: [name, role]
      properties:
        name: { type: string, minLength: 1 }
        password:
          type: string
          format: password
          minLength: 12
          description: '**Omit to leave the password unchanged.** Sending it resets it.'
        role: { $ref: '#/components/schemas/AdminRole' }
        scopePublisherId: { type: [string, 'null'] }
        scopeInstitutionId: { type: [string, 'null'] }

    Publisher:
      type: object
      required: [id, code, name, status]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        logoUrl: { type: string, format: uri }
        status: { $ref: '#/components/schemas/RecordStatus' }
        itemCount: { type: integer }
        collectionCount: { type: integer }
        createdAt: { type: string, format: date-time }

    PublisherWrite:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9-]{2,40}$'
          description: Lower case, digits and hyphens. Unique.
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        logoUrl: { type: string, format: uri }

    PublisherPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Publisher' }

    Collection:
      type: object
      description: >-
        A collection carries no membership array. Which books belong to it lives on
        the books, in `catalogueItems.collectionIds`.
      required: [id, publisherId, code, name]
      properties:
        id: { type: string }
        publisherId: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        itemCount:
          type: integer
          description: >-
            Derived, not stored. Counted from `catalogueItems.collectionIds` on read,
            the same way `Entitlement.resolvedItemCount` works.

    CollectionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Collection' }

    CollectionWrite:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9-]{2,40}$'
          description: Unique within its publisher.
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }

    Asset:
      type: object
      description: |
        What the operator sees about a file. `storageKey`, `indexKey` and `masterWrappedBek`
        are internal and are never returned to any client.
      properties:
        format: { $ref: '#/components/schemas/AssetFormat' }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        cipherLength: { type: [integer, 'null'], minimum: 1 }
        encrypted:
          type: boolean
          description: False for every open access title and for all audio, whatever the tier.
        hasSearchIndex: { type: boolean }
        indexSkipReason:
          type: [string, 'null']
          maxLength: 300
          description: Set when text extraction failed. The book is still READY, just not searchable.
        indexTerms: { type: [integer, 'null'], minimum: 0 }

    CatalogueItem:
      type: object
      required: [id, publisherId, title, contentType, accessTier, status, contentState]
      properties:
        id: { type: string }
        publisherId: { type: string }
        publisherName: { type: string }
        collectionIds:
          type: array
          description: >-
            Where collection membership is stored. A `Collection` carries no matching
            `itemIds` array, so this is the only copy of the relationship.
          items: { type: string }
        title: { type: string }
        subtitle: { type: string }
        authors:
          type: array
          items: { type: string }
        editors:
          type: array
          description: Edited volumes have editors and no authors. Becomes `editor` in the feed.
          items: { type: string }
        narrators:
          type: array
          description: Audio only. Becomes `narrator` in the feed.
          items: { type: string }
        isbn:
          description: Null when the title has none.
          oneOf:
            - $ref: '#/components/schemas/Isbn'
            - type: 'null'
        contentType: { $ref: '#/components/schemas/ContentType' }
        accessTier: { $ref: '#/components/schemas/AccessTier' }
        subjects:
          type: array
          items: { type: string }
        language: { type: string }
        description: { type: string }
        publishedAt:
          type: [string, 'null']
          format: date
          description: >-
            Publication date. The `publishedAt.asc` and `publishedAt.desc` sort options
            order on this, and it becomes `published` in OPDS metadata.
        numberOfPages:
          type: [integer, 'null']
          description: PDF only. Set by ingest once the file is processed, null before that.
        duration:
          type: [integer, 'null']
          description: Seconds. Audio only, supplied by the operator at create time.
        coverUrl: { type: [string, 'null'], format: uri }
        status: { $ref: '#/components/schemas/ItemStatus' }
        contentState: { $ref: '#/components/schemas/ContentState' }
        contentError: { type: [string, 'null'] }
        assets:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: Touched by every write, including ingest state changes. `IngestStatus` returns it.

    CatalogueItemWrite:
      type: object
      required: [publisherId, title, contentType, accessTier]
      properties:
        publisherId: { type: string }
        collectionIds:
          type: array
          maxItems: 50
          description: >-
            The single source of truth for collection membership. A collection has no
            `itemIds` array of its own, so this is the only place the relationship is
            stored. Indexed.
          items: { type: string }
        title: { type: string, minLength: 1, maxLength: 300 }
        subtitle: { type: string, maxLength: 300 }
        authors:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 120 }
        editors:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 120 }
        narrators:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
        isbn: { $ref: '#/components/schemas/Isbn' }
        contentType: { $ref: '#/components/schemas/ContentType' }
        accessTier: { $ref: '#/components/schemas/AccessTier' }
        subjects:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        language: { type: string, maxLength: 20 }
        description: { type: string, maxLength: 4000 }
        publishedAt: { type: [string, 'null'], format: date }
        duration:
          type: [integer, 'null']
          minimum: 1
          description: Seconds. Required when `contentType` is AUDIO. `numberOfPages` is not settable, ingest derives it.
        coverUrl: { type: string, format: uri }
        status: { $ref: '#/components/schemas/ItemStatus' }

    CatalogueItemPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CatalogueItem' }

    IngestStatus:
      type: object
      required: [itemId, contentState]
      properties:
        itemId: { type: string }
        format: { $ref: '#/components/schemas/AssetFormat' }
        contentState: { $ref: '#/components/schemas/ContentState' }
        contentError: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    AdminInstitution:
      allOf:
        - $ref: '#/components/schemas/InstitutionDetail'
        - type: object
          properties:
            type: { $ref: '#/components/schemas/InstitutionType' }
            emailDomains:
              type: array
              description: Used to help a user find their institution by email. Not used for authentication.
              items: { type: string }
            status: { $ref: '#/components/schemas/RecordStatus' }
            catalogueVersion:
              type: integer
              minimum: 0
              description: |
                A counter bumped by any change that affects what a member would see. Both
                the feed cache and the `ETag` are keyed on it, so bumping it makes every
                stale cache entry unreachable rather than needing to be found and deleted.

                **Miss a bump and that institution is served a stale feed until something
                else changes it.** The full list of writes that must bump it:

                | Write |
                |---|
                | entitlement created, amended or revoked |
                | collection membership changed |
                | catalogue item published or archived |
                | catalogue item finished ingest, `contentState` becomes `READY` |
                | publisher suspended or reactivated |
                | institution suspended or reactivated |
                | feed settings saved |

                The last-but-one is the one that gets forgotten, because it happens in a
                background worker rather than in a controller.
            summary:
              type: object
              properties:
                entitlementCount: { type: integer }
                accessibleItemCount: { type: integer }
                feedUrl: { type: string, format: uri }

    AdminInstitutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminInstitution' }

    InstitutionWrite:
      type: object
      required: [code, name, type, country]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9-]{2,40}$'
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/InstitutionType' }
        country: { type: string, minLength: 2, maxLength: 60 }
        city: { type: string, maxLength: 80 }
        emailDomains:
          type: array
          maxItems: 20
          items: { type: string }
        signIn: { $ref: '#/components/schemas/SignInWrite' }
        branding: { $ref: '#/components/schemas/Branding' }

    Entitlement:
      type: object
      required: [id, institutionId, scopeType, scopeId, status]
      properties:
        id: { type: string }
        institutionId: { type: string }
        scopeType: { $ref: '#/components/schemas/EntitlementScope' }
        scopeId: { type: string }
        scopeLabel:
          type: string
          maxLength: 200
          description: >-
            Human readable, for the console.
            For example "Collection - Law and Technology 2024".
        copyLimited:
          type: boolean
          description: >-
            Whether **this grant** caps concurrent readers. Derived on read: `false` when
            `copies` is null, `true` when it is a number. Not settable, set `copies`
            instead so the two can never disagree.

            This describes the grant, **not the book**. A book's own terms are its
            `accessTier`. The two are separate: an `ELITE` book is copy limited by nature,
            while this field records what the institution actually bought.
        copies:
          type: [integer, 'null']
          minimum: 1
          description: Applies only to copy-limited titles. Null means no limit.
        loanPeriodDays: { type: integer, minimum: 1 }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/EntitlementStatus' }
        resolvedItemCount:
          type: integer
          minimum: 0
          description: >-
            How many books this grant currently resolves to. Recomputed on read.

            **Overlapping grants each count the same book**, so two grants' counts do not
            add up to a distinct total. `AdminInstitution.summary.accessibleItemCount`
            de-duplicates; these numbers do not.
        version:
          type: integer
          minimum: 0
          description: For optimistic locking. Send it back on update.

    EntitlementPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Entitlement' }

    EntitlementCreate:
      type: object
      description: No `version` on create. The server sets it.
      required: [scopeType, scopeId]
      properties:
        scopeType: { $ref: '#/components/schemas/EntitlementScope' }
        scopeId: { type: string }
        copies:
          type: [integer, 'null']
          minimum: 1
          description: Null means unlimited. A number makes the grant copy limited.
        loanPeriodDays: { type: integer, default: 14, minimum: 1 }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }

    EntitlementUpdate:
      type: object
      description: >-
        Amends the **terms** of a grant. `scopeType` and `scopeId` are not here: to
        re-point a grant, revoke it and create a new one. `version` is required.
      required: [version]
      properties:
        copies: { type: [integer, 'null'], minimum: 1 }
        loanPeriodDays: { type: integer, minimum: 1 }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        version:
          type: integer
          minimum: 0
          description: >-
            From the record you loaded. If somebody else saved since, you get
            `409 STALE_VERSION` rather than silently overwriting them.

    Shelf:
      type: object
      description: >-
        One of exactly three curated slots. `id` is fixed; the operator sets the title,
        the position and which books appear. An empty `itemIds` hides the shelf.
      required: [id, title, order, itemIds]
      properties:
        id:
          type: string
          enum: [shelf_1, shelf_2, shelf_3]
        title: { type: string, minLength: 1, maxLength: 60 }
        order: { type: integer, minimum: 1, maximum: 3 }
        itemIds:
          type: array
          maxItems: 50
          description: >-
            Hand picked by the operator, **in display order**. The feed preserves this
            order exactly, so it is not re-sorted and the `sort` parameter does not
            apply. Every id must be a book the institution is currently entitled to.
            Empty means the shelf is hidden.
          items: { type: string }

    FeedSettings:
      type: object
      description: |
        How one institution's feed is presented. Stored in the `feedSettings`
        collection, 1:1 with an institution.

        This does **not** control which books an institution gets. That is governed by
        entitlements. Feed settings only decide the title, the shelves and the paging.

        **Shelves are curated, not computed.** Three slots, `shelf_1` to `shelf_3`. The
        operator chooses the title, the position and the individual books on each.

        A shelf is a presentation list, never an authorisation one. Every id is
        re-checked on read against `status = PUBLISHED`, `contentState = READY` and the
        institution's current entitlements, and anything that fails is dropped.
      required: [feedTitle, pageSize, shelves]
      properties:
        institutionId:
          type: string
          description: Read only. It is already in the path.
        feedTitle: { type: string }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        defaultSort: { $ref: '#/components/schemas/SortOrder' }
        shelves:
          type: array
          minItems: 3
          maxItems: 3
          description: Always exactly three, one per slot, even if some are empty.
          items: { $ref: '#/components/schemas/Shelf' }
        catalogueVersion:
          type: integer
          description: >-
            Read only. A server counter the save bumps for you. Not accepted on write.
        version:
          type: integer
          description: >-
            For optimistic locking. Send it back on save. Not the same as
            `catalogueVersion`: that one is a cache key the server bumps, this one is
            **which copy of the record you edited**.

    FeedSettingsWrite:
      type: object
      description: >-
        What the console may set. `institutionId` is in the path and `catalogueVersion`
        is server owned, so neither is accepted here.

        **`version` is required**, because this endpoint replaces all three shelves at
        once. Without it, two operators curating at the same time means the second save
        silently wipes the first operator's shelves with no error shown to either of them.
      required: [feedTitle, pageSize, shelves, version]
      properties:
        feedTitle: { type: string, minLength: 1, maxLength: 80 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        defaultSort: { $ref: '#/components/schemas/SortOrder' }
        shelves:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/Shelf' }
        version:
          type: integer
          minimum: 0
          description: >-
            From the record you loaded with `GET`. If somebody else saved since, you get
            `409 STALE_VERSION` instead of overwriting their work.

    AuditLog:
      type: object
      required: [id, action, at]
      properties:
        id: { type: string }
        actorId: { type: [string, 'null'] }
        actorEmail: { type: [string, 'null'] }
        action:
          type: string
          example: UPDATE
        entityType: { type: string }
        entityId: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        meta:
          type: [object, 'null']
          description: On a CONTENT_ACCESS record this carries the device public key fingerprint, the intent and the format.
        at: { type: string, format: date-time }

    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }
