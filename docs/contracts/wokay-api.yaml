                  currentPage: 0
                links:
                  - rel: self
                    href: http://localhost:8080/opds/v1/public/search?query=robots
                    type: application/opds+json
                publications:
                  - metadata:
                      '@type': http://schema.org/Book
                      title: Ethnographies of Waiting
                      publisher: { name: CRC Press }
                      language: en
                    links:
                      - rel: self
                        href: http://localhost:8080/opds/v1/public/publications/item_ab6
                        type: application/opds-publication+json
                      - rel: http://opds-spec.org/acquisition/open-access
                        href: '{flambeauBaseUrl}/api/v1/content/item_ab6/access'
                        type: application/json
                        properties:
                          licenceModel: OPEN_ACCESS
                          indirectAcquisition: [{ type: application/epub+zip }]
                          hasSearchIndex: true
                          canPersist: true
                    images:
                      - href: https://cdn.tf/covers/item_ab6.jpg
                        type: image/jpeg
                  - metadata:
                      '@type': http://schema.org/Book
                      identifier: urn:isbn:9780367211745
                      title: Rights for Robots
                      author: [{ name: Joshua C. Gellers }]
                      publisher: { name: Routledge }
                      language: en
                    links:
                      - rel: self
                        href: http://localhost:8080/opds/v1/public/publications/item_42
                        type: application/opds-publication+json
                      - rel: http://opds-spec.org/acquisition/subscribe
                        href: http://localhost:8080/api/v1/institutions
                        type: application/json
                        title: Available through your institution
                        properties:
                          licenceModel: ELITE
                          availability: { state: unavailable }
                    images:
                      - href: https://cdn.tf/covers/item_42.jpg
                        type: image/jpeg
        '400': { $ref: '#/components/responses/BadRequest' }

  /opds/v1/public/publications/{itemId}:
    get:
      tags: [Catalogue feed]
      operationId: getPublicPublication
      summary: One book's metadata, for any published book
      description: |
        Full metadata for any book that is `PUBLISHED` and `READY`, with no token and
        regardless of entitlement. This is the detail screen behind a discovery search
        result.

        `404` **only** when the book is genuinely unknown or archived. Not entitled is
        no longer a 404 here, because the caller has just seen the book in their own
        search results and pretending it does not exist would be a lie they can detect.

        Metadata is returned. The **file is not**. An open access title carries a real
        acquisition link to flambeau. Anything else carries a `subscribe` link to
        `GET /api/v1/institutions` with `availability.state` of `unavailable`, so the
        reader is shown how to get access rather than a dead end.
      x-stability: DRAFT
      x-called-by: [team1]
      security: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: One publication, as a standalone document
          headers:
            Cache-Control:
              schema: { type: string }
              example: public, max-age=300
          content:
            application/opds-publication+json:
              schema: { $ref: '#/components/schemas/OpdsPublicationDocument' }
              example:
                '@context': https://readium.org/webpub-manifest/context.jsonld
                metadata:
                  '@type': http://schema.org/Book
                  identifier: urn:isbn:9780367211745
                  title: Rights for Robots
                  subtitle: Artificial Intelligence, Animal and Environmental Law
                  author:
                    - { name: Joshua C. Gellers, sortAs: 'Gellers, Joshua C.' }
                  publisher: { name: Routledge }
                  language: en
                  published: '2020-09-30'
                  subject: [{ name: Law }, { name: Technology }]
                  numberOfPages: 212
                links:
                  - rel: self
                    href: http://localhost:8080/opds/v1/public/publications/item_42
                    type: application/opds-publication+json
                  - rel: http://opds-spec.org/acquisition/subscribe
                    href: http://localhost:8080/api/v1/institutions
                    type: application/json
                    title: Available through your institution
                    properties:
                      licenceModel: ELITE
                      availability: { state: unavailable }
                images:
                  - href: https://cdn.tf/covers/item_42.jpg
                    type: image/jpeg
        '404':
          description: Unknown or archived. Not entitled is **not** a 404 on this route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-08-11T14:00:00Z'
                status: 404
                code: NOT_FOUND
                message: No such item
                path: /opds/v1/public/publications/item_999
                traceId: b7c1f2a9

