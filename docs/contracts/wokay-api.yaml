                  scopePublisherId: pub_rtlg
                  scopeInstitutionId: null
                  status: ACTIVE
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/v1/auth/refresh:
    post:
      tags: [Admin · auth]
      operationId: adminRefresh
      summary: Trade a refresh token for a new access token
      description: |
        The access token lives 15 minutes. This is how a console session survives longer
        than that without asking for the password again.

        **The old refresh token is revoked and a new one issued** on every call, so a
        stolen one is usable at most once before the real operator's next refresh
        invalidates it.

        Takes no access token: an expired access token is the normal reason to be here.
        Holding the refresh token is the proof.

        Admin only. App token refresh belongs to flambeau.
      x-stability: DRAFT
      x-called-by: [wokay]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example:
              refreshToken: 8Kd2mXqR7vT1nP4wZ0aB3cE6gH9jL5sY
      responses:
        '200':
          description: A new pair. The one you sent is now dead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJ0Zi1hZG1pbiJ9.sig2
                expiresIn: 900
                refreshToken: 4Qw8zN2vC5xM7bK1rT6yU0pA3dF9hJ2e
                refreshExpiresIn: 43200
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >-
            Unknown, expired, already used or revoked. All four are the same answer, and
            the only cure is signing in again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-08-12T14:00:00Z'
                status: 401
                code: UNAUTHENTICATED
                message: Sign in again
                path: /api/admin/v1/auth/refresh
                traceId: b7c1f2a9

  /api/admin/v1/auth/logout:
    post:
      tags: [Admin · auth]
      operationId: adminLogout
      summary: Revoke a refresh token
      description: |
        Marks the refresh token revoked so it can never be exchanged again.

        **It kills the access token too.** Every admin request re-checks its session
        against `adminSessions`, so once this call sets `revokedAt` the access token fails
        on its next use. There is no residual window.

        The console should still drop its own copy, to avoid one guaranteed `401`.

        This applies to **admin tokens only**. App tokens on `/opds/v1/**` and
        `/api/v1/**` carry no server lookup, which is what keeps feed rendering fast.

        Always `204`, even for a token that never existed, so nobody can probe which
        ones are live.
      x-stability: DRAFT
      x-called-by: [wokay]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example:
              refreshToken: 8Kd2mXqR7vT1nP4wZ0aB3cE6gH9jL5sY
      responses:
        '204':
          description: Revoked, or was never valid. Same answer either way.

        '400': { $ref: '#/components/responses/BadRequest' }
