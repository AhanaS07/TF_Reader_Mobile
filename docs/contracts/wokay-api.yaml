openapi: 3.1.0

info:
  title: wokay API
  version: 0.1.0
  summary: Onboarding and Admin (CAP-1) and OPDS Catalogue (CAP-5)
  description: |
    Team wokay's HTTP surface for the Taylor and Francis Reader prototype.

    ## Read this first

    The backend is one Spring Boot application with every team's modules inside it, so
    flambeau does not call us over HTTP. They call two Java interfaces in the same
    process:

    | Interface | Question it answers |
    |---|---|
    | `catalogue.api.EntitlementQuery` | May this institution access this book, and on what terms |
    | `content.api.ContentAccessGrant` | Give me the file link and the key for this book |

    The **interfaces** are published as code, not as endpoints. The **data shapes** they
    pass are documented here anyway, so there is one file to read rather than two:
    `ContentGrantRequest`, `SubjectRef`, `LoanProof`, `ContentGrant`, `SignedUrl`,
    `IndexUrl` and `Encryption`. Those belong to no path in this file and never will. Nor
    does `AdminSession`, which is a collection rather than a seam.

    ## We do not serve content over HTTP

    **There is no wokay endpoint that returns a book, in any tier.** Every acquisition
    link in every feed points at flambeau, who checks the loan and then calls
    `ContentAccessGrant` in the same process. The bytes then travel from object storage
    straight to the device and pass through neither module.

    | Tier | Acquisition `rel` | Href points at |
    |---|---|---|
    | Open access | `.../acquisition/open-access` | flambeau |
    | Subscription | `.../acquisition/borrow` | flambeau |
    | Elite | `.../acquisition/borrow` | flambeau |
    | Not obtainable by this caller | `.../acquisition/subscribe` | our public institution list |

    So there is one path for the app to learn instead of three, and one place that can
    hand out a key.

    **Every acquisition `href` in the examples below is a PLACEHOLDER.** flambeau's paths
    are their own to define and reach us as configuration, `tf.flambeau.base-url`.
    Follow the href we give you at runtime. Do not hardcode anything you read here.

    ## Stability

    Every operation carries `x-stability`.

    * **FROZEN**: safe to build against. Changing it needs a cohort conversation.
    * **DRAFT**: the shape may still move. Do not depend on field-level detail yet.

    `x-called-by` is present on every operation another team calls. Admin operations
    omit it, because the whole `/api/admin/v1/**` surface is ours alone.

    ## Two token audiences and no third

    | | Admin token | App token |
    |---|---|---|
    | Issued by | us, `/api/admin/v1/auth/login` | flambeau |
    | `aud` claim | `tf-admin` | `tf-app` |
    | Accepted on | `/api/admin/v1/**` | `/opds/v1/**`, `/api/v1/**` |

    Checked on every request. An admin token cannot read a catalogue feed and an app
    token cannot reach the admin API. There is no service audience, because module to
    module calls carry no token at all.

    ## Conventions

    * Identifiers are prefixed strings: `pub_`, `inst_`, `col_`, `item_`, `ent_`, `adm_`,
      plus `sess_` for an admin session and `loan_` for one of flambeau's loans
    * All timestamps are ISO-8601 UTC
    * Paging is `page` (zero based) and `size`; responses carry `page`, `size`, `total`
    * Every error uses the same envelope, see the `Error` schema
    * Deletes are soft. Records move to an inactive status, they are not removed
    * Follow the URLs we hand you rather than building them

    ## Reading the OPDS feeds

    The feeds are OPDS 2.0, <https://specs.opds.io/opds-2.0>. Three response shapes
    across seven endpoints, so write three parsers rather than seven.

    **Arrays are never empty.** If there is nothing to put in one, the key is absent.
    Test for presence, not length.

    **`properties` appears on acquisition links and nowhere else.** Everything the UI
    decides, `licenceModel` and `canPersist` and `copies`, lives there. These are our
    extensions to OPDS: a generic reader ignores them, our app needs them.

    **One vocabulary for the three tiers: `OPEN_ACCESS`, `SUBSCRIPTION`, `ELITE`.** The
    same three values appear in `licenceModel` in a feed, in `accessTier` on a book, and
    in the `?accessTier=` filter. There is nothing to translate.
  contact:
    name: Team wokay

servers:
  - url: http://localhost:8080
    description: >-
      Everyone runs the same Spring Boot application locally on port 8080, and every
      example URL in this file assumes it. There is no shared deployment.

tags:
  - name: Institutions (public)
    description: The only unauthenticated endpoints. A user must find their institution before they can sign in to it.
  - name: Catalogue feed
    description: >-
      OPDS 2.0 feeds. Institution feeds are entitlement scoped and differ per customer.
      The `/opds/v1/public/**` routes are not scoped: browsing shows open access only,
      but discovery search and publication detail return every published book, without
      the file.
  - name: Catalogue fetch
    description: Plain JSON for clients that do not want to parse a feed.
  - name: Admin · auth
  - name: Admin · publishers
  - name: Admin · collections
  - name: Admin · catalogue items
  - name: Admin · institutions
  - name: Admin · entitlements
  - name: Admin · users
  - name: Admin · audit

security: []

paths:

  # ────────────────────────────────────────────────────────────────
  # PUBLIC
  # ────────────────────────────────────────────────────────────────

  /api/v1/institutions:
    get:
      tags: [Institutions (public)]
      operationId: listInstitutions
      summary: List institutions, for the find-your-institution screen
      description: |
        No token. Public fields only: no entitlements, no publisher links, no counts.

        **Only `ACTIVE` institutions appear**, and a suspended one is simply absent rather
        than flagged. Sorted ascending by `name`.

        Asking for a suspended one by id is a `404` on the detail endpoint, not a `403`,
        so its existence is never disclosed.
      x-stability: FROZEN
      x-called-by: [team1]
      security: []
      parameters:
        - name: q
          in: query
          description: Free text search over the institution name
          schema: { type: string }
          example: imp
        - name: country
          in: query
          description: ISO country name or code, exact match
          schema: { type: string }
          example: UK
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of institutions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionPage' }
              example:
                items:
                  - id: inst_7f3
                    code: imperial
                    name: Imperial College London
                    country: UK
                    city: London
                    branding:
                      logoUrl: https://cdn.tf/logos/imperial.png
                      primaryColor: '#003E74'
                  - id: inst_2b9
                    code: oxford
                    name: University of Oxford
                    country: UK
                    city: Oxford
                    branding:
                      logoUrl: https://cdn.tf/logos/oxford.png
                      primaryColor: '#002147'
                page: 0
                size: 20
                total: 2
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/institutions/{institutionId}:
    get:
      tags: [Institutions (public)]
      operationId: getInstitution
      summary: One institution, with branding and where to sign in
      description: |
        No token.

        `signIn.method` is always `SAML`. It stays in the payload so the client needs
        no special case, but there is no field on the institution record to configure.

        `catalogueUrl` is handed over so the client never has to build our URLs. Follow
        it rather than constructing it.
      x-stability: FROZEN
      x-called-by: [team1, flambeau]
      security: []
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
      responses:
        '200':
          description: The institution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionDetail' }
              example:
                id: inst_7f3
                code: imperial
                name: Imperial College London
                country: UK
                city: London
                branding:
                  logoUrl: https://cdn.tf/logos/imperial.png
                  primaryColor: '#003E74'
                signIn:
                  method: SAML
                  idpHint: imperial-saml-mock
                catalogueUrl: http://localhost:8080/opds/v1/institutions/inst_7f3/catalogue
        '404':
          description: Unknown or inactive institution. The two are deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-08-11T14:00:00Z'
                status: 404
                code: NOT_FOUND
                message: No such institution
                path: /api/v1/institutions/inst_999
                traceId: b7c1f2a9

  # ────────────────────────────────────────────────────────────────
  # OPDS FEEDS
  # ────────────────────────────────────────────────────────────────

  /opds/v1/institutions/{institutionId}/catalogue:
    get:
      tags: [Catalogue feed]
      operationId: getRootFeed
      summary: Root feed. One request draws the home screen
      description: |
        The home screen in one request. Two parts, and they behave differently.

        **`groups` are the three curated shelves.** An operator picks the title, the
        position and the individual books on each one, in `feedSettings`. Each group
        carries the first ten books inline plus a `self` link to the rest. A shelf with
        no books, or whose books are all archived or no longer entitled, is **omitted
        entirely** rather than returned empty.

        **`navigation` always contains one entry, *All titles*.** Curated shelves cover
        only what an operator chose, so without this there would be no way to browse the
        rest of the entitled catalogue. It is present even when all three shelves are
        empty, which is what keeps a brand new institution's feed valid.

        Everything in either part is filtered to what this institution is entitled to
        plus everything that is open access.

        The `institutionId` in the path must match the one in the token, otherwise
        `403 FORBIDDEN_INSTITUTION_MISMATCH`.

        There is no `next` link on the root feed. It is a navigation feed, not a list.
      x-stability: FROZEN
      x-called-by: [team1]
      security: [{ appToken: [] }]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
      responses:
        '200':
          description: The root feed
          headers:
            ETag:
              description: Keyed on the institution's catalogueVersion. Send it back as If-None-Match.
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
              example: private, max-age=60
          content:
            application/opds+json:
              schema: { $ref: '#/components/schemas/OpdsNavigationFeed' }
              example:
                metadata:
                  title: Imperial College Library
                  numberOfItems: 418
                links:
                  - rel: self
                    href: http://localhost:8080/opds/v1/institutions/inst_7f3/catalogue
                    type: application/opds+json
                  - rel: search
                    href: http://localhost:8080/opds/v1/institutions/inst_7f3/search{?query}
                    type: application/opds+json
                    templated: true
                navigation:
                  - title: All titles
                    href: http://localhost:8080/opds/v1/institutions/inst_7f3/groups/all
                    type: application/opds+json
                    rel: subsection
                groups:
                  - metadata: { title: New this month, numberOfItems: 1 }
                    links:
                      - rel: self
                        href: http://localhost:8080/opds/v1/institutions/inst_7f3/groups/shelf_1
                        type: application/opds+json
                    publications:
                      - metadata:
                          '@type': http://schema.org/Book
                          identifier: urn:isbn:9780367211745
                          title: Rights for Robots
                          author: [{ name: Joshua C. Gellers }]
                          publisher: { name: Routledge }
                          language: en
                          published: '2020-09-30'
                          subject: [{ name: Law }, { name: Technology }]
                          numberOfPages: 212
                        images:
                          - href: https://cdn.tf/covers/item_42.jpg
                            type: image/jpeg
                        links:
                          - rel: self
                            href: http://localhost:8080/opds/v1/institutions/inst_7f3/publications/item_42
                            type: application/opds-publication+json
                          - rel: http://opds-spec.org/acquisition/borrow
                            href: '{flambeauBaseUrl}/api/v1/loans?itemId=item_42'
                            type: application/json
                            properties:
                              licenceModel: ELITE
                              indirectAcquisition: [{ type: application/pdf }]
                              copies: { total: 2 }
                              encrypted:
                                algorithm: 'http://www.w3.org/2009/xmlenc11#aes256-gcm'
                                originalLength: 6373752
                              hasSearchIndex: true
                              canPersist: false
        '304': { description: Not modified. The If-None-Match value still matches. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InstitutionMismatch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /opds/v1/institutions/{institutionId}/groups/{groupId}:
    get:
      tags: [Catalogue feed]
      operationId: getGroupFeed
      summary: One shelf, or the whole entitled catalogue
      description: |
        `groupId` is one of `shelf_1`, `shelf_2`, `shelf_3` or the literal `all`.

        | `groupId` | Returns | `sort` and filters |
        |---|---|---|
        | `shelf_1..3` | the operator's hand picked books, **in the order they chose** | ignored, curation is the order |
        | `all` | every book this institution may see | honoured |

        Follow `next` until it is absent. Do not count pages and do not build the URL
        yourself.

        A curated shelf that is empty, or whose books have all been archived or lost
        their entitlement, returns `404`. It is not in the root feed either, so there is
        nothing to link to. `all` never 404s: worst case it is a feed carrying only a
        `self` link and a `navigation` entry back to the catalogue.
      x-stability: FROZEN
      x-called-by: [team1]
      security: [{ appToken: [] }]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - name: groupId
          in: path
          required: true
          description: A curated shelf, or `all` for the whole entitled catalogue.
          schema:
            type: string
            enum: [shelf_1, shelf_2, shelf_3, all]
          example: shelf_1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: >-
            Applies to `all` only. Ignored on a curated shelf, where the operator's
            order is the order.
          schema: { $ref: '#/components/schemas/SortOrder' }
          example: publishedAt.desc
        - $ref: '#/components/parameters/ContentTypeFilter'
        - $ref: '#/components/parameters/AccessTierFilter'
      responses:
        '200':
          description: A page of publications
          content:
            application/opds+json:
              schema: { $ref: '#/components/schemas/OpdsPublicationFeed' }
              example:
                metadata:
                  title: New this month
                  numberOfItems: 1
                  itemsPerPage: 20
                  currentPage: 0
                  modified: '2026-08-10T09:00:00Z'
                links:
                  - rel: self
                    href: http://localhost:8080/opds/v1/institutions/inst_7f3/groups/shelf_1?page=0
                    type: application/opds+json
                  - rel: search
                    href: http://localhost:8080/opds/v1/institutions/inst_7f3/search{?query}
                    type: application/opds+json
                    templated: true
                    title: Search this catalogue
                publications:
                  - metadata:
                      '@type': http://schema.org/Book
                      identifier: urn:isbn:9780367211745
                      title: Rights for Robots
                      author: [{ name: Joshua C. Gellers }]
                      publisher: { name: Routledge }
                      language: en
                      published: '2020-09-30'
                      subject: [{ name: Law }, { name: Technology }]
                      numberOfPages: 212
                    links:
                      - rel: self
                        href: http://localhost:8080/opds/v1/institutions/inst_7f3/publications/item_42
                        type: application/opds-publication+json
                      - rel: http://opds-spec.org/acquisition/borrow
                        href: '{flambeauBaseUrl}/api/v1/loans?itemId=item_42'
                        type: application/json
                        properties:
                          licenceModel: ELITE
                          indirectAcquisition: [{ type: application/pdf }]
                          copies: { total: 2 }
                          encrypted:
                            algorithm: 'http://www.w3.org/2009/xmlenc11#aes256-gcm'
                            originalLength: 6373752
                          hasSearchIndex: true
                          canPersist: false
                    images:
                      - href: https://cdn.tf/covers/item_42.jpg
                        type: image/jpeg
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InstitutionMismatch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /opds/v1/institutions/{institutionId}/search:
    get:
      tags: [Catalogue feed]
      operationId: searchCatalogue
      summary: Catalogue search, always entitlement scoped
      description: |
        Searches **metadata**: title, authors, subjects, description and ISBN. It does
        not search the text inside books. That is the in-file index, which runs on the
        device with no server call.

        **An ISBN is matched exactly, not fuzzily.** If the query matches the ISBN
        pattern once hyphens are stripped, it becomes an equality lookup and returns at
        most one book. Everything else goes to the text index. So `9780367211745` and
        `978-0-367-21174-5` both find the same title.

        The query is always combined with the entitlement filter, so a result the
        caller cannot open is never returned.

        A zero-result search returns a valid feed containing a `navigation` entry back
        to the catalogue, never an empty `publications` array. The OPDS schema forbids
        empty arrays.
      x-stability: FROZEN
      x-called-by: [team1]
      security: [{ appToken: [] }]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - name: query
          in: query
          required: true
          description: The search term
          schema: { type: string }
          example: robots
        - $ref: '#/components/parameters/ContentTypeFilter'
        - $ref: '#/components/parameters/AccessTierFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matching publications
          content:
            application/opds+json:
              schema: { $ref: '#/components/schemas/OpdsPublicationFeed' }
              examples:
                hits:
                  summary: The normal case. Matches come back in `publications`
                  value:
                    metadata:
                      title: 'Search: robots'
                      numberOfItems: 1
                      itemsPerPage: 20
                      currentPage: 0
                    links:
                      - rel: self
                        href: http://localhost:8080/opds/v1/institutions/inst_7f3/search?query=robots
                        type: application/opds+json
                    publications:
                      - metadata:
                          '@type': http://schema.org/Book
                          identifier: urn:isbn:9780367211745
                          title: Rights for Robots
                          author: [{ name: Joshua C. Gellers }]
                          publisher: { name: Routledge }
                          language: en
                          published: '2020-09-30'
                          subject: [{ name: Law }, { name: Technology }]
                          numberOfPages: 212
                        links:
                          - rel: self
                            href: http://localhost:8080/opds/v1/institutions/inst_7f3/publications/item_42
                            type: application/opds-publication+json
                          - rel: http://opds-spec.org/acquisition/borrow
                            href: '{flambeauBaseUrl}/api/v1/loans?itemId=item_42'
                            type: application/json
                            properties:
                              licenceModel: ELITE
                              indirectAcquisition: [{ type: application/pdf }]
                              copies: { total: 2 }
                              encrypted:
                                algorithm: 'http://www.w3.org/2009/xmlenc11#aes256-gcm'
                                originalLength: 6373752
                              hasSearchIndex: true
                              canPersist: false
                        images:
                          - href: https://cdn.tf/covers/item_42.jpg
                            type: image/jpeg
                noResults:
                  summary: >-
                    Nothing matched. Still 200, still a valid feed, but `navigation`
                    replaces `publications` because an empty array is not allowed.
                  value:
                    metadata:
                      title: 'Search: quantum knitting'
                      numberOfItems: 0
                    links:
                      - rel: self
                        href: http://localhost:8080/opds/v1/institutions/inst_7f3/search?query=quantum+knitting
                        type: application/opds+json
                    navigation:
                      - title: Browse the full catalogue
                        href: http://localhost:8080/opds/v1/institutions/inst_7f3/catalogue
                        type: application/opds+json
                        rel: subsection
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InstitutionMismatch' }

  /opds/v1/institutions/{institutionId}/publications/{itemId}:
    get:
      tags: [Catalogue feed]
      operationId: getPublication
      summary: One book, in full
      description: |
        Returns a **standalone publication document**, not a feed. There is no
        `publications` array: `metadata`, `links` and `images` are at the top level,
        which is what the `application/opds-publication+json` content type means.

        Returns `404` if the item is unknown, archived **or not entitled**. The three
        are deliberately indistinguishable, so the catalogue cannot be mapped by
        walking identifiers.

        Refetch this after a borrow or a return. It is the only place a copy count
        changes, and only for copy-limited titles.
      x-stability: FROZEN
      x-called-by: [team1]
      security: [{ appToken: [] }]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: One publication, as a standalone document
          content:
            application/opds-publication+json:
              schema: { $ref: '#/components/schemas/OpdsPublicationDocument' }
              example:
                '@context': https://readium.org/webpub-manifest/context.jsonld
                metadata:
                  '@type': http://schema.org/Book
                  identifier: urn:isbn:9780367211745
                  title: Rights for Robots
                  subtitle: Artificial Intelligence, Animal and Environmental Law
                  author:
                    - { name: Joshua C. Gellers, sortAs: 'Gellers, Joshua C.' }
                  publisher: { name: Routledge }
                  language: en
                  published: '2020-09-30'
                  modified: '2026-08-02T11:00:00Z'
                  subject: [{ name: Law }, { name: Technology }]
                  description: >-
                    Bringing a unique perspective to the ethical and legal issues
                    surrounding artificial intelligence.
                  numberOfPages: 212
                links:
                  - rel: self
                    href: http://localhost:8080/opds/v1/institutions/inst_7f3/publications/item_42
                    type: application/opds-publication+json
                  - rel: http://opds-spec.org/acquisition/borrow
                    href: '{flambeauBaseUrl}/api/v1/loans?itemId=item_42'
                    type: application/json
                    title: Borrow
                    properties:
                      licenceModel: ELITE
                      indirectAcquisition: [{ type: application/pdf }]
                      copies: { total: 2 }
                      encrypted:
                        algorithm: 'http://www.w3.org/2009/xmlenc11#aes256-gcm'
                        originalLength: 6373752
                      hasSearchIndex: true
                      canPersist: false
                images:
                  - href: https://cdn.tf/covers/item_42.jpg
                    type: image/jpeg
                    width: 400
                    height: 600
                  - href: https://cdn.tf/covers/item_42-thumb.jpg
                    type: image/jpeg
                    width: 100
                    height: 150
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InstitutionMismatch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /opds/v1/public/catalogue:
    get:
      tags: [Catalogue feed]
      operationId: getPublicFeed
      summary: Open access catalogue, no sign in
      description: |
        No token. **A flat, paginated list of every open access title.**

        There are no shelves here and no groups. Curated shelves live in an institution's
        `feedSettings`, and a reader with no institution has none, so this feed is a
        single list rather than a home screen.

        This is the second entry point into the app, for a reader who has not signed in.

        **Browse deliberately shows less than search finds.** This feed is *what you can
        read right now*; `/opds/v1/public/search` is *what exists*.
      x-stability: FROZEN
      x-called-by: [team1]
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: The public feed
          headers:
            Cache-Control:
              schema: { type: string }
              example: public, max-age=300
          content:
            application/opds+json:
              schema: { $ref: '#/components/schemas/OpdsPublicationFeed' }
              example:
                metadata:
                  title: Free to read
                  numberOfItems: 1
                  itemsPerPage: 20
                  currentPage: 0
                links:
                  - rel: self
                    href: http://localhost:8080/opds/v1/public/catalogue?page=0
                    type: application/opds+json
                  - rel: search
                    href: http://localhost:8080/opds/v1/public/search{?query}
                    type: application/opds+json
                    templated: true
                publications:
                  - metadata:
                      '@type': http://schema.org/Book
                      title: Ethnographies of Waiting
                      editor:
                        - { name: Manpreet K. Janeja }
                        - { name: Andreas Bandak }
                      publisher: { name: CRC Press }
                      language: en
                      published: '2018-11-01'
                      subject: [{ name: Anthropology }]
                      numberOfPages: 264
                    links:
                      - rel: self
