        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogueItemWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/v1/catalogue-items/{itemId}/content:
    post:
      tags: [Admin · catalogue items]
      operationId: uploadContent
      summary: Upload the file for a book
      description: |
        Returns `202` immediately. Locking, text extraction and index building happen in
        the background. Poll the ingest status endpoint to watch progress.

        Upload limit 100 MB, and 20 MB for anything that will be locked, because a
        locked file is decrypted whole on the device.

        Open access titles and all audio are stored as they are, with no lock.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, format]
              properties:
                file:
                  type: string
                  format: binary
                format:
                  $ref: '#/components/schemas/AssetFormat'
      responses:
        '202':
          description: Accepted. Processing has been queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestStatus' }
              example:
                itemId: item_42
                format: PDF
                contentState: QUEUED
                contentError: null
                updatedAt: '2026-08-10T09:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-08-11T14:00:00Z'
                status: 413
                code: VALIDATION_FAILED
                message: A file that will be locked may not exceed 20 MB
                path: /api/admin/v1/catalogue-items/item_42/content
                traceId: b7c1f2a9

  /api/admin/v1/catalogue-items/{itemId}/ingest-status:
    get:
      tags: [Admin · catalogue items]
      operationId: getIngestStatus
      summary: Watch a file being processed
      description: |
        `QUEUED` to `PROCESSING` to `READY`, or `FAILED` with a reason.

        A book that is not `READY` never appears in any feed, so failures must be
        visible to the operator. Anything stuck for more than fifteen minutes is moved
        to `FAILED` by a watchdog.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────
  # ADMIN · INSTITUTIONS
  # ────────────────────────────────────────────────────────────────

  /api/admin/v1/institutions:
    get:
      tags: [Admin · institutions]
      operationId: adminListInstitutions
      summary: List institutions
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RecordStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of institutions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInstitutionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin · institutions]
      operationId: createInstitution
      summary: Create an institution
      description: Creating one also creates its default feed settings, so a brand new institution returns a valid, if sparse, feed rather than a 404.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionWrite' }
            example:
              code: imperial
              name: Imperial College London
              type: UNIVERSITY
              country: UK
              city: London
              emailDomains: [imperial.ac.uk]
              signIn:
                idpHint: imperial-saml-mock
              branding:
                logoUrl: https://cdn.tf/logos/imperial.png
                primaryColor: '#003E74'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInstitution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/CodeTaken' }

  /api/admin/v1/institutions/{institutionId}:
    parameters:
      - $ref: '#/components/parameters/InstitutionId'
    get:
      tags: [Admin · institutions]
      operationId: adminGetInstitution
      summary: One institution, with a summary of what it can access
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: The institution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInstitution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin · institutions]
      operationId: updateInstitution
      summary: Update an institution
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInstitution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/v1/institutions/{institutionId}/status:
    patch:
      tags: [Admin · institutions]
      operationId: setInstitutionStatus
      summary: Activate or suspend an institution
      description: A suspended institution disappears from the public list and its members receive 403 on every feed.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChange' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInstitution' }

        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/v1/institutions/{institutionId}/entitlements:
    parameters:
      - $ref: '#/components/parameters/InstitutionId'
    get:
      tags: [Admin · entitlements]
      operationId: listEntitlements
      summary: Access grants held by an institution
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of grants, each with how many books it resolves to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin · entitlements]
      operationId: createEntitlement
      summary: Grant an institution access
      description: |
        Scope is a whole publisher, one collection, or a single book.

        `copies` applies only when the granted items are copy limited. On overlapping
        grants the most permissive wins.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntitlementCreate' }
            example:
              scopeType: COLLECTION
              scopeId: col_law2024
              copies: 2
              loanPeriodDays: 14
              validFrom: '2026-01-01'
              validTo: '2026-12-31'
      responses:
        '201':
          description: Created, including how many books it resolves to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/v1/entitlements/{entitlementId}:
    parameters:
      - name: entitlementId
        in: path
        required: true
        schema: { type: string }
        example: ent_5a1
    put:
      tags: [Admin · entitlements]
      operationId: updateEntitlement
      summary: Amend a grant
      description: Uses optimistic locking. A stale `version` returns 409.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntitlementUpdate' }
            example:
              copies: 5
              loanPeriodDays: 21
              validTo: '2027-12-31'
              version: 3
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Somebody else changed this grant first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                timestamp: '2026-08-11T14:00:00Z'
                status: 409
                code: STALE_VERSION
                message: This grant was changed by somebody else. Reload and try again
                path: /api/admin/v1/entitlements/ent_5a1
                traceId: b7c1f2a9
    delete:
      tags: [Admin · entitlements]
      operationId: revokeEntitlement
      summary: Revoke a grant
      description: Soft. The grant moves to REVOKED and the content disappears from the feed on the next request.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/v1/institutions/{institutionId}/feed-settings:
    parameters:
      - $ref: '#/components/parameters/InstitutionId'
    get:
      tags: [Admin · institutions]
      operationId: getFeedSettings
      summary: Feed settings for an institution
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin · institutions]
      operationId: setFeedSettings
      summary: Update feed settings and curate the three shelves
      description: |
        Saving bumps `catalogueVersion`, which invalidates the cached feed on the next
        request. That matters more here than anywhere else, because shelf **contents**
        change, not just titles.

        Validation, all `400 VALIDATION_FAILED`:

        | Rule |
        |---|
        | Exactly three shelves, ids `shelf_1` to `shelf_3`, no duplicates |
        | Every shelf has a non-blank title |
        | `order` is 1, 2 and 3, each used once |
        | Every `itemId` exists |
        | Every `itemId` is currently entitled to this institution, and the message names any that are not |
        | No more than 50 ids on a shelf |

        There is deliberately **no rule that a shelf must be non-empty**, and no rule
        that at least one shelf is filled. The root feed always carries an *All titles*
        navigation entry, so it stays valid even when nothing has been curated yet.
      x-stability: DRAFT
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedSettingsWrite' }
            example:
              feedTitle: Imperial College Library
              pageSize: 20
              defaultSort: publishedAt.desc
              version: 7
              shelves:
                - id: shelf_1
                  title: New this month
                  order: 1
                  itemIds: [item_42]
                - id: shelf_2
                  title: Law essentials
                  order: 2
                  itemIds: [item_88]
                - id: shelf_3
                  title: Audio picks
                  order: 3
                  itemIds: []
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleVersion' }

