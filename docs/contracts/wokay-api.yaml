              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJ0Zi1hZG1pbiJ9.sig
                expiresIn: 900
                refreshToken: 8Kd2mXqR7vT1nP4wZ0aB3cE6gH9jL5sY
                refreshExpiresIn: 43200
                user:
                  id: adm_2
