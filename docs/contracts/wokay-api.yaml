  /opds/v1/public/search:
    get:
      tags: [Catalogue feed]
      operationId: searchPublicCatalogue
      summary: Discovery search. Every published book, entitled or not
      description: |
        **This is the one search that is not entitlement scoped.** It returns every book
        that is `PUBLISHED` and `READY`, whether the caller can open it or not.

        It exists for the reader with no institution: anonymous, or signed in
        individually. Browsing shows them open access only, but searching shows them
        what Taylor and Francis publishes, so there is something to discover and
        something to sell.

        Same search behaviour as the institutional endpoint, including exact ISBN
        matching. The only difference is that the entitlement filter is left out.

        A token is accepted and ignored. A member who calls this gets the same public
        answer as anybody else; their own scoped search is under
        `/opds/v1/institutions/{id}/search`.

        Books the caller cannot obtain still carry an acquisition link, because OPDS
        requires one on every publication. Theirs is
        `rel: http://opds-spec.org/acquisition/subscribe` pointing at
        `GET /api/v1/institutions`, with `properties.availability.state` of `unavailable`
        and no `indirectAcquisition`. Render the metadata and a route to access rather
        than a Read button.
      x-stability: DRAFT
      x-called-by: [team1]
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
          example: robots
        - $ref: '#/components/parameters/ContentTypeFilter'
        - $ref: '#/components/parameters/AccessTierFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Matching publications, obtainable or not
          headers:
            Cache-Control:
              description: >-
